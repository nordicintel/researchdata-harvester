name: Harvest
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Refresh every candidate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: researchdata-harvest
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      base_commit: ${{ steps.inventory.outputs.base_commit }}
      has_changes: ${{ steps.inventory.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: inventory
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          args=()
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          uv run python -m scripts.sync --stage inventory --work-directory data/work/action "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventory
          path: |
            data/work/action/inventory.json
            data/work/action/inventory-run.log
          retention-days: 1
          overwrite: true
  dataportalen:
    needs: inventory
    if: needs.inventory.outputs.has_changes == 'true'
    uses: ./.github/workflows/fetch-dataportalen.yml
    with:
      base_commit: ${{ needs.inventory.outputs.base_commit }}
  researchdata:
    needs: inventory
    if: needs.inventory.outputs.has_changes == 'true'
    uses: ./.github/workflows/fetch-researchdata.yml
    with:
      base_commit: ${{ needs.inventory.outputs.base_commit }}
  publish:
    needs: [inventory, dataportalen, researchdata]
    if: needs.inventory.outputs.has_changes == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      base_commit: ${{ needs.inventory.outputs.base_commit }}
