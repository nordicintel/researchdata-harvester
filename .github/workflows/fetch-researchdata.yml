name: Fetch researchdata
on:
  workflow_call:
    inputs:
      base_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_commit }}
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: inventory
          path: data/work/action
      - name: Restore completed records on a rerun
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: researchdata
          path: data/work/action
      - run: uv run python -m scripts.sync --stage researchdata --work-directory data/work/action
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: researchdata
          path: |
            data/work/action/researchdata.json
            data/work/action/researchdata-cache.json.gz
            data/work/action/researchdata/
            data/work/action/researchdata-report.json
            data/work/action/researchdata-run.log
          retention-days: 1
          overwrite: true
          if-no-files-found: warn
