name: Validate
on:
  push:
    paths-ignore:
      - 'data/current/**'
  pull_request:
    paths-ignore:
      - 'data/current/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check harvester scripts tests/current
      - run: uv run ruff format --check harvester scripts tests/current
      - run: uv run python -m pytest
      - name: Validate the published catalog
        run: uv run python -c "from pathlib import Path; from harvester.storage import validate_catalog; print(validate_catalog(Path('data/current')))"
