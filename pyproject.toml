[project]
name = "researchdata-harvester"
version = "0.1.0"
description = "Independent Researchdata and Dataportalen metadata harvester"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "defusedxml>=0.7",
    "rdflib>=7",
    "duckdb>=2.0.0",
]

[tool.uv]
package = false

[tool.split-data-files]
max_mb = 100
target_mb = 50

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
