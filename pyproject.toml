[project]
name = "researchdata-harvester"
version = "0.1.0"
description = "Independent Researchdata and Dataportalen metadata harvester"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "defusedxml>=0.7",
    "rdflib>=7",
    "duckdb>=2.0.0",
    "tenacity>=9.2.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pyreadstat>=1.3.7",
    "pyld>=3.3.0",
    "referencing>=0.37.0",
]

[tool.uv]
package = false

[tool.split-data-files]
max_mb = 100
target_mb = 50

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Run explicitly after hook changes: uv run python -m pytest tests/test_split_data_files.py
addopts = "--ignore=tests/test_split_data_files.py"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".work"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["harvester", "scripts"]

[[tool.mypy.overrides]]
module = ["pyld", "pyld.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["harvester", "scripts"]
venvPath = "."
venv = ".venv"
